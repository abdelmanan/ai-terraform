# Limites par adresse IP. Une génération coûte des tokens Groq et plusieurs
# minutes de CPU : sans limite, n'importe qui peut vider le quota ou saturer
# l'instance. Le backend plafonne aussi le nombre de générations simultanées
# (MAX_CONCURRENT_GENERATIONS) : les deux se complètent.
#
# $binary_remote_addr est l'IP du client tant que nginx est exposé directement.
# Derrière un load balancer ce serait l'IP du LB : il faudrait alors
# real_ip_header X-Forwarded-For.
limit_req_zone  $binary_remote_addr zone=generate:10m rate=1r/m;
limit_req_zone  $binary_remote_addr zone=api:10m      rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Authentification basique optionnelle : ce fichier est vide par défaut et
    # rempli au démarrage si BASIC_AUTH_USER / BASIC_AUTH_PASSWORD sont définis
    # (voir 40-basic-auth.sh).
    include /etc/nginx/auth/auth.conf;

    limit_req_status  429;
    limit_conn_status 429;

    location / {
        try_files $uri $uri/ =404;
    }

    # Point de contrôle unique pour la CI, un load balancer ou une sonde : il
    # doit rester joignable sans authentification.
    location = /health {
        auth_basic off;
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # La génération : une par minute par IP (nginx ne sait pas compter par
    # heure), une seule à la fois, avec une petite marge
    # pour un double-clic ou une nouvelle tentative après erreur.
    location = /api/generate {
        limit_req  zone=generate burst=2 nodelay;
        limit_conn perip 1;

        proxy_pass http://backend:8000/api/generate;
        include /etc/nginx/conf.d/proxy_params.inc;

        # Une génération complète = appel IA (jusqu'à 180s) + terraform init
        # (jusqu'à 420s), réparations comprises, sur une seule requête. Le
        # défaut de 60s la couperait en plein vol.
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # Le navigateur appelle /api sur sa propre origine : plus d'URL codée en
    # dur dans le frontend, et plus besoin de CORS du tout.
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8000/api/;
        include /etc/nginx/conf.d/proxy_params.inc;

        # Le ZIP peut être volumineux : on le streame au lieu de le bufferiser.
        proxy_buffering off;
    }

    # Réponses d'erreur en JSON, au format du backend, pour que le frontend
    # puisse afficher le message au lieu d'une page HTML nginx.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"status":"error","message":"Too many requests, please retry later."}';
    }
}
