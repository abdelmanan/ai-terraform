server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Point de contrôle unique pour la CI, un load balancer ou une sonde.
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # Le navigateur appelle /api sur sa propre origine : plus d'URL codée en
    # dur dans le frontend, et plus besoin de CORS du tout.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une génération complète = appel IA (jusqu'à 180s) + terraform init
        # (jusqu'à 420s) sur une seule requête. Le défaut de 60s la couperait
        # en plein vol et l'utilisateur perdrait une génération valide.
        proxy_connect_timeout 10s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # Le ZIP peut être volumineux : on le streame au lieu de le bufferiser.
        proxy_buffering off;
    }
}
